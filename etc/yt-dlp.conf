# System-wide yt-dlp defaults, baked into the image at /etc/yt-dlp.conf.
# Applied to every job; per-show .yt-dlp scripts only need URL + format.

# --- Rate limiting: stay under YouTube's guest rate limit and avoid
#     "Sign in to confirm you're not a bot" flags on batch runs. ---
--sleep-requests 1
--sleep-interval 5
--max-sleep-interval 15

# --- SponsorBlock: mark sponsor/intro/outro etc. as chapters
#     (non-destructive; players can skip them). Switch to
#     --sponsorblock-remove if you'd rather cut the segments out. ---
--sponsorblock-mark all

# --- Resilience on the NFS-backed media volume. ---
--file-access-retries 10
--socket-timeout 30

# --- PO Token provider (bgutil HTTP server, reachable by container name
#     on the shared ytdlp-net docker network). Future-proofs YouTube
#     extraction as PO Token enforcement rolls out. ---
--extractor-args youtubepot-bgutilhttp:base_url=http://bgutil-provider:4416
